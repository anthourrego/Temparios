<ion-progress-bar *ngIf="searching" type="indeterminate"></ion-progress-bar>

<ion-content color="gray">

	<ion-refresher slot="fixed" (ionRefresh)="obtenerCentroProd($event)">
		<ion-refresher-content></ion-refresher-content>
	</ion-refresher>

	<ion-card>
		<ion-card-header>
			<ion-card-title class="ion-margin-start">
				<strong>Eficiencia</strong>
			</ion-card-title>
		</ion-card-header>
		<ion-card-content class="ion-no-padding ion-padding-bottom">
			<ion-grid class="ion-no-padding">
				<ion-row>
					<ion-col *ngFor="let op of valoresEficiencia" class="ion-text-center indicador">
						{{ op }}
					</ion-col>
				</ion-row>
				<ion-row>
					<ion-col *ngFor="let op of tituloEficiencia" class="ion-text-center tiempo">
						{{ op }}
					</ion-col>
				</ion-row>
			</ion-grid>
		</ion-card-content>
	</ion-card>


	<ion-grid class="ion-no-padding">
		<ion-row *ngIf="actividades.length">
			<ion-col size="6" *ngFor="let op of actividades">
				<ion-card>
					<ion-card-header class="ion-no-padding">
						<ion-item lines="none">
							<ion-label class="ion-no-margin">
								<h6>{{ op['Nombre'] }}</h6>
								<p>Orden: {{ op['NumerOrden'] }}</p>
							</ion-label>
							<ion-icon color="dark" (click)="presentActionSheet()" name="ellipsis-vertical" slot="end">
							</ion-icon>
						</ion-item>
					</ion-card-header>
					<ion-card-content class="ion-no-padding">
						<ion-grid>
							<ion-row class="ion-justify-content-evenly">
								<ion-col size="5" (click)="agregarTiempoActividad(op)">
									<div class="cantidad-proceso">
										<p class="conteo-accion">{{ +op['CantiRecib'] }}</p>
										<ion-progress-bar color="secondary"
											[color]="op['valProgress'] < 0.40 ? 'danger' : (op['valProgress'] > 0.74 ? 'success' : 'warning')"
											[value]="op['valProgress']">
										</ion-progress-bar>
										<p>{{ +op['CantidadTotal'] }}</p>
									</div>
								</ion-col>
								<ion-col size="5">
									<div class="ion-text-center">
										<div class="cantidad-proceso letra-reproceso">
											<strong>0</strong> Reprocesos
										</div>
										<div class="tiempo">
											<strong>{{ (op['Tiempo'] ? +op['Tiempo'] : 0) + ' ' }}</strong>&nbsp;Minutos
										</div>
									</div>
								</ion-col>
							</ion-row>
						</ion-grid>
					</ion-card-content>
				</ion-card>
			</ion-col>
		</ion-row>

		<ion-row *ngIf="!searching && !actividades.length">
			<ion-col size="12" class="ion-text-center">
				No hay actividades agregadas
			</ion-col>
		</ion-row>
	</ion-grid>

	<ion-fab slot="fixed" vertical="bottom" horizontal="center">
		<ion-grid>
			<ion-row>
				<ion-col class="ion-no-padding"
					[ngClass]="it['accion'] == 'cambiar-centro' ? (dataCentroProduccion['cantidad'] > 1 ? '' : 'd-none') : ''"
					*ngFor="let it of botones">
					<ion-fab-button (click)="accionBoton(it)" class="ion-no-margin" mode="ios" size="small"
						[color]="it['color']">
						<ion-icon [name]="it['icono']"></ion-icon>
					</ion-fab-button>
				</ion-col>
			</ion-row>
		</ion-grid>
	</ion-fab>
</ion-content>
